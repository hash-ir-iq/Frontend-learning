<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GearStop</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Header Section -->
        <header class="header">
            <div class="container"> 
                <aside class="navbar">
                    <ul class="nav-links">
                        <!-- Swapped .html references for #ids -->
                        <a href="#home" class="nav-link" style="color: var(--secondary-color); font-weight: 650; font-size: large;">Home</a>
                        <a href="#products" class="nav-link">Products</a>
                        <a href="#about" class="nav-link">About</a>
                        <a href="#contact" class="nav-link">Contact</a>
                        
                        <form class="search-form">
                            <input type="text" class="search-input" placeholder="Search">
                            <button type="submit" class="search-button"><img src="search-interface-symbol.png" width="15" height="15" alt="Search"></button>
                        </form>
                    </ul>
                </aside>
            </div>
        </header>

        <!-- Landing Page Sections (Scroll Targets) -->
        <section id="home" class="page-section">
            <h1>Welcome to GearStop</h1>
        </section>

        <section id="products" class="page-section">
            <h1>Our Products</h1>
        </section>

        <section id="about" class="page-section">
            <h1>About Us</h1>
        </section>

        <section id="contact" class="page-section">
            <h1>Contact Us</h1>
        </section>
    </body>
</html>
